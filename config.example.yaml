http_listen_addr: ':8080'
# Prefer DATABASE_URL in the environment for credentials.
database_url: ''
storage_dir: data/eml
shutdown_timeout: 30s
smtp_listen_addr: ':587'
smtp_domain: localhost
smtp_tls_cert: ''
smtp_tls_key: ''
max_message_bytes: 26214400
# Provider encryption key is read only from RELAYTALE_MASTER_KEY.
worker_count: 0

maintenance_interval: 0s
eml_retention_days: 180
debug_retention_days: 30
cleanup_batch: 100

retry_enabled: false

failover_enabled: false

health_enabled: false

# Shared ingress/outbound admission and outbound disk snapshot budget.
memory_budget_bytes: 67108864
spool_budget_bytes: 268435456
snapshot_dir: ""

smtp_max_connections: 128
smtp_max_connections_per_ip: 8
smtp_auth_per_minute: 60
smtp_auth_burst: 20
smtp_max_session_seconds: 300
auth_concurrency: 2
auth_memory_budget_bytes: 134217728
# METRICS_BEARER_TOKEN is environment-only; never store a real token here.

# Management credentials are environment-only: ADMIN_API_KEYS (default disabled).
# See docs/management-api.md; do not place tokens in this YAML.
