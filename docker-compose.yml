name: relaytale

x-runtime-logging: &runtime-logging
  driver: local
  options:
    max-size: '10m'
    max-file: '5'
    compress: 'true'

services:
  postgres:
    logging: *runtime-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relaytale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-relaytale}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  relaytale:
    mem_limit: ${RELAYTALE_MEMORY_LIMIT:-512m}
    cpus: ${RELAYTALE_CPU_LIMIT:-2}
    logging: *runtime-logging
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-relaytale}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-relaytale}?sslmode=disable
      HTTP_LISTEN_ADDR: ':8080'
      EML_STORAGE_DIR: /data/eml
      SHUTDOWN_TIMEOUT: 30s
      SMTP_LISTEN_ADDR: ':587'
      SMTP_DOMAIN: localhost
      SMTP_TLS_CERT: /data/tls/smtp.crt
      SMTP_TLS_KEY: /data/tls/smtp.key
      MAX_MESSAGE_BYTES: 26214400
      GOMEMLIMIT: ${RELAYTALE_GO_MEMORY_LIMIT:-384MiB}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      SMTP_MAX_CONNECTIONS: ${SMTP_MAX_CONNECTIONS:-128}
      SMTP_MAX_CONNECTIONS_PER_IP: ${SMTP_MAX_CONNECTIONS_PER_IP:-8}
      SMTP_AUTH_PER_MINUTE: ${SMTP_AUTH_PER_MINUTE:-60}
      SMTP_AUTH_BURST: ${SMTP_AUTH_BURST:-20}
      SMTP_MAX_SESSION_SECONDS: ${SMTP_MAX_SESSION_SECONDS:-300}
      AUTH_CONCURRENCY: ${AUTH_CONCURRENCY:-2}
      AUTH_MEMORY_BUDGET_BYTES: ${AUTH_MEMORY_BUDGET_BYTES:-134217728}
      MEMORY_BUDGET_BYTES: ${MEMORY_BUDGET_BYTES:-67108864}
      SPOOL_BUDGET_BYTES: ${SPOOL_BUDGET_BYTES:-268435456}
      SNAPSHOT_DIR: /data/snapshots
      WORKER_COUNT: ${WORKER_COUNT:-0}
      HEALTH_ENABLED: ${HEALTH_ENABLED:-false}
      FAILOVER_ENABLED: ${FAILOVER_ENABLED:-false}
      RETRY_ENABLED: ${RETRY_ENABLED:-false}
      RELAYTALE_MASTER_KEY: ${RELAYTALE_MASTER_KEY-${MAILGATEWAY_MASTER_KEY:-}}
      MAINTENANCE_INTERVAL: ${MAINTENANCE_INTERVAL:-0s}
      EML_RETENTION_DAYS: ${EML_RETENTION_DAYS:-180}
      DEBUG_RETENTION_DAYS: ${DEBUG_RETENTION_DAYS:-30}
      CLEANUP_BATCH: ${CLEANUP_BATCH:-100}
    ports:
      - '${SMTP_BIND:-127.0.0.1}:1587:587'
    volumes:
      - mail_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health/ready]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 50s
    restart: unless-stopped
  caddy:
    logging: *runtime-logging
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - '${HTTP_BIND:-127.0.0.1}:8080:80'
      - '${HTTP_BIND:-127.0.0.1}:8443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relaytale:
        condition: service_healthy
    restart: unless-stopped
  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: relaytale_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: relaytale_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U relaytale_test -d relaytale_test']
      interval: 2s
      timeout: 3s
      retries: 15
  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://relaytale_test:isolated-test-only@postgres-test:5432/relaytale_test?sslmode=disable
    depends_on:
      postgres-test:
        condition: service_healthy
volumes:
  postgres_data:
  mail_data:
  caddy_data:
  caddy_config:
