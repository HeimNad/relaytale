# Opt-in example: adapt networking and mount a private metrics bearer token file.
# Notifications require separately configured Alertmanager routing.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: relaytale
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/relaytale-metrics-token
    static_configs:
      - targets: ['relaytale:8080']
