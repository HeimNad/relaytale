name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relaytale_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: relaytale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relaytale_test -d relaytale_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      GO111MODULE: 'on'
      TEST_DATABASE_URL: postgres://relaytale_test:isolated-ci-only@localhost:5432/relaytale_test?sslmode=disable
      REQUIRE_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format, vet, build and race tests with PostgreSQL
        run: make ci
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Check UI formatting
        run: npm run check:ui
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser workflows with isolated PostgreSQL and Fake SMTP
        run: sh scripts/test-browser.sh
